name: Gerar AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 22.04: o AppImage gerado roda em Mint, Ubuntu, Debian, Fedora, etc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm install

      - name: Compilar AppImage
        run: NO_STRIP=true npm run tauri build -- --bundles appimage

      - name: Guardar o arquivo (execução manual)
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
